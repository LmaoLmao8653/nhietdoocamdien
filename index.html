<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Giám Sát Ổ Cắm Điện Thông Minh</title>
    <!-- Thư viện Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Thư viện Firebase (Compat version) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-blue: #3b82f6;
            --accent-orange: #f97316;
            --safe-color: #10b981;
            --danger-color: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        body { background-color: var(--bg-color); color: var(--text-main); padding: 20px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding-bottom: 12px; border-bottom: 1px solid #334155; }
        .header h1 { font-size: 22px; font-weight: 600; }
        
        .btn-simulate { background-color: var(--accent-blue); color: white; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn-simulate:hover { background-color: #2563eb; }

        .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
        
        .card { background-color: var(--card-bg); padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); text-align: center; }
        .card h3 { color: var(--text-muted); font-size: 14px; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
        .card .value { font-size: 28px; font-weight: bold; }
        
        .val-temp { color: var(--accent-orange); }
        .val-power { color: #a855f7; }
        .val-volt { color: #eab308; }
        .val-amp { color: #06b6d4; }
        .status-on { color: var(--safe-color); }
        .status-off { color: var(--danger-color); animation: blink 1s infinite alternate; }

        @keyframes blink { from { opacity: 1; } to { opacity: 0.5; } }

        .chart-container { background-color: var(--card-bg); padding: 20px; border-radius: 12px; height: 400px; width: 100%; }

        /* Modal CSS */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background-color: var(--card-bg); padding: 24px; border-radius: 12px; width: 90%; max-width: 400px; }
        .modal-content h2 { margin-bottom: 16px; font-size: 18px; border-bottom: 1px solid #334155; padding-bottom: 8px; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; margin-bottom: 6px; color: var(--text-muted); font-size: 14px; }
        .form-group input { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: white; outline: none; }
        .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
        .btn-submit { flex: 1; background-color: var(--safe-color); color: white; border: none; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn-cancel { flex: 1; background-color: #475569; color: white; border: none; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header">
        <h1>📊 Dashboard Giám Sát Ổ Cắm (ESP32)</h1>
        <button class="btn-simulate" onclick="openModal()">⚡ Mô phỏng Dữ liệu</button>
    </div>

    <!-- Khối hiển thị thông số -->
    <div class="dashboard-grid">
        <div class="card">
            <h3>Nhiệt độ Cảm biến</h3>
            <div class="value val-temp" id="val-temp">-- °C</div>
        </div>
        <div class="card">
            <h3>Công suất Thực</h3>
            <div class="value val-power" id="val-power">-- W</div>
        </div>
        <div class="card">
            <h3>Điện áp</h3>
            <div class="value val-volt" id="val-volt">-- V</div>
        </div>
        <div class="card">
            <h3>Dòng điện</h3>
            <div class="value val-amp" id="val-amp">-- A</div>
        </div>
        <div class="card">
            <h3>Trạng thái Rơ-le</h3>
            <div class="value" id="val-relay">Đang kết nối...</div>
        </div>
    </div>

    <!-- Khối Biểu đồ -->
    <div class="chart-container">
        <canvas id="temperatureChart"></canvas>
    </div>

    <!-- Hộp thoại Mô phỏng (Simulation Modal) -->
    <div class="modal" id="sim-modal">
        <div class="modal-content">
            <h2>Thiết lập Dữ liệu Mô phỏng</h2>
            <form id="sim-form" onsubmit="submitSimulation(event)">
                <div class="form-group">
                    <label>Nhiệt độ (°C) - (Trên 70°C sẽ ngắt mạch):</label>
                    <input type="number" step="0.1" id="sim-temp" required value="35.5">
                </div>
                <div class="form-group">
                    <label>Công suất (W):</label>
                    <input type="number" step="0.1" id="sim-power" required value="100.0">
                </div>
                <div class="form-group">
                    <label>Điện áp (V):</label>
                    <input type="number" step="0.1" id="sim-volt" required value="220.0">
                </div>
                <div class="form-group">
                    <label>Dòng điện (A):</label>
                    <input type="number" step="0.01" id="sim-amp" required value="0.45">
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-cancel" onclick="closeModal()">Hủy</button>
                    <button type="submit" class="btn-submit">Bắn Dữ Liệu Lên Firebase</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MÃ JAVASCRIPT XỬ LÝ LOGIC -->
    <script>
        // 1. CẤU HÌNH FIREBASE (Trích xuất từ code C++ của bạn)
        const firebaseConfig = {
            databaseURL: "https://truyendulieu-default-rtdb.asia-southeast1.firebasedatabase.app/"
        };
        
        firebase.initializeApp(firebaseConfig);
        const dbRef = firebase.database().ref('sensor');

        // 2. KHỞI TẠO BIỂU ĐỒ CHART.JS
        const MAX_POINTS = 20;
        let timeLabels = Array.from({length: MAX_POINTS}, () => "");
        let temperatureData = new Array(MAX_POINTS).fill(null);

        const ctx = document.getElementById('temperatureChart').getContext('2d');
        const temperatureChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: timeLabels,
                datasets: [{
                    label: 'Nhiệt độ (°C)',
                    data: temperatureData,
                    borderColor: '#f97316',
                    backgroundColor: 'rgba(249, 115, 22, 0.1)',
                    borderWidth: 2,
                    fill: true,
                    tension: 0.4,
                    pointRadius: 3
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: { 
                        title: { display: true, text: 'Nhiệt độ (°C)', color: '#94a3b8' },
                        grid: { color: '#334155' },
                        ticks: { color: '#94a3b8' },
                        suggestedMin: 20, 
                        suggestedMax: 80 
                    },
                    x: { 
                        grid: { display: false },
                        ticks: { color: '#94a3b8' }
                    }
                },
                plugins: {
                    legend: { labels: { color: '#f8fafc' } }
                }
            }
        });

        // 3. LẮNG NGHE DỮ LIỆU TỪ FIREBASE REALTIME
        dbRef.on('value', (snapshot) => {
            const data = snapshot.val();
            if (!data) return;

            // Đọc các giá trị JSON
            let temp = parseFloat(data.temperature || 0);
            let power = parseFloat(data.power || 0);
            let volt = parseFloat(data.voltage || 0);
            let amp = parseFloat(data.current || 0);
            let relay = data.relay; // 1: HIGH (Ngắt), 0: LOW (Bật)

            // Cập nhật các khối số liệu trên web
            document.getElementById('val-temp').innerText = temp.toFixed(1) + " °C";
            document.getElementById('val-power').innerText = power.toFixed(1) + " W";
            document.getElementById('val-volt').innerText = volt.toFixed(1) + " V";
            document.getElementById('val-amp').innerText = amp.toFixed(2) + " A";

            // Xử lý hiển thị Rơ-le dựa theo logic C++
            const relayElem = document.getElementById('val-relay');
            if (relay === 1) {
                relayElem.innerText = "NGẮT (Bảo vệ)";
                relayElem.className = "value status-off";
            } else {
                relayElem.innerText = "BẬT (An toàn)";
                relayElem.className = "value status-on";
            }

            // Cập nhật biểu đồ nhiệt độ
            let now = new Date();
            let timeString = `${now.getHours()}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`;
            
            temperatureChart.data.labels.shift();
            temperatureChart.data.labels.push(timeString);
            
            temperatureChart.data.datasets[0].data.shift();
            temperatureChart.data.datasets[0].data.push(temp);
            
            temperatureChart.update();
        });

        // 4. XỬ LÝ GIAO DIỆN MÔ PHỎNG
        function openModal() { document.getElementById('sim-modal').style.display = 'flex'; }
        function closeModal() { document.getElementById('sim-modal').style.display = 'none'; }

        function submitSimulation(event) {
            event.preventDefault();
            let sTemp = parseFloat(document.getElementById('sim-temp').value);
            let sPower = parseFloat(document.getElementById('sim-power').value);
            let sVolt = parseFloat(document.getElementById('sim-volt').value);
            let sAmp = parseFloat(document.getElementById('sim-amp').value);

            // Logic ngắt rơ-le theo code C++: Nhiệt độ mục tiêu >= 70
            let sRelay = (sTemp >= 70.0) ? 1 : 0;

            // Đẩy thẳng dữ liệu lên Node "sensor" trên Firebase
            dbRef.set({
                temperature: sTemp,
                power: sPower,
                voltage: sVolt,
                current: sAmp,
                relay: sRelay
            }).then(() => {
                console.log("Đã giả lập gửi dữ liệu lên Firebase");
            }).catch((error) => {
                console.error("Lỗi gửi dữ liệu mô phỏng: ", error);
            });

            closeModal();
        }

        // Đóng modal khi click ra ngoài
        window.onclick = function(event) {
            let modal = document.getElementById('sim-modal');
            if (event.target === modal) {
                closeModal();
            }
        }
    </script>
</body>
</html>
